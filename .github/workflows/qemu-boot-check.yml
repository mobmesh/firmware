name: qemu-boot-check

# Boots the shipped firmware vendored under pages/flasher/ in QEMU and watches for a crash
# or boot loop -- the real binary, byte for byte. See .github/scripts/qemu_boot_check.py for
# what counts as pass/fail. heltec_v4 is Xtensa, xiao_c3 RISC-V, so the matrix pairs each.

on:
  workflow_run:
    workflows: ["build-release"]
    types: [completed]
  workflow_dispatch:

env:
  QEMU_TAG: esp-develop-9.2.2-20260417
  QEMU_BUILD: esp_develop_9.2.2_20260417
  SHA256_xtensa: 0eecb2a34a5586c0e59110f77b9343b7b336e82fdb0e1a30e1dc1bab8a547e35
  SHA256_riscv32: 547f03e04701a92cbb699f7f7d015adc1f5b5ef93cbb94c0dd9b7107e2d84e77

jobs:
  boot-check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        board: [heltec_v4, xiao_c3]
        variant: [repeater, room_server]
        include:
          - board: heltec_v4
            arch: xtensa
            machine: esp32s3
            mem: 8M
          - board: xiao_c3
            arch: riscv32
            machine: esp32c3
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      # Espressif's build, pinned and checksum-verified; the tarball carries the boot ROMs.
      # The apt list is the binary's DT_NEEDED entries minus glibc -- SDL2 included, which
      # is required even headless.
      - name: Fetch qemu-system-${{ matrix.arch }}
        env:
          SHA256: ${{ matrix.arch == 'xtensa' && env.SHA256_xtensa || env.SHA256_riscv32 }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgcrypt20 libpixman-1-0 libsdl2-2.0-0 libslirp0
          asset="qemu-${{ matrix.arch }}-softmmu-${QEMU_BUILD}-x86_64-linux-gnu.tar.xz"
          curl -sSfL --retry 3 --retry-delay 5 \
            -O "https://github.com/espressif/qemu/releases/download/${QEMU_TAG}/${asset}"
          echo "${SHA256}  ${asset}" | sha256sum -c -
          tar xJf "$asset"

      - id: boot
        name: Boot ${{ matrix.board }}/${{ matrix.variant }} and check for crash/boot loop
        run: |
          mkdir -p workdir
          python3 .github/scripts/qemu_boot_check.py \
            --board-id ${{ matrix.board }} \
            --variant ${{ matrix.variant }} \
            --boards-json pages/flasher/boards.json \
            --flasher-dir pages/flasher \
            --qemu-bin qemu/bin/qemu-system-${{ matrix.arch }} \
            --machine ${{ matrix.machine }} \
            --mem "${{ matrix.mem }}" \
            --rom-dir qemu/share/qemu \
            --workdir workdir

      - name: Upload serial capture on failure
        if: failure() && steps.boot.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: qemu-boot-check-${{ matrix.board }}-${{ matrix.variant }}-serial-log
          path: workdir/serial_capture.log
          retention-days: 14

      # One long-lived issue per variant, and only for a real boot failure -- a broken
      # toolchain fetch fails loudly rather than being filed as a firmware crash.
      - name: Open, update, or close the tracking issue
        if: always() && steps.boot.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.boot.outcome == 'failure' }}
        with:
          script: |
            const failed = process.env.FAILED === 'true';
            const board = '${{ matrix.board }}';
            const variant = '${{ matrix.variant }}';
            const title = `[${board}/${variant}] QEMU boot check failed -- possible crash/boot loop`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const existing = (await github.rest.issues.listForRepo({
              ...repo, state: 'open', labels: 'qemu-boot-check',
            })).data.find(i => i.title === title);

            if (failed) {
              const body = [
                `The published \`${board}\`/\`${variant}\` release firmware failed the QEMU boot-loop check -- see the captured serial output, uploaded as an artifact on the run below.`,
                ``,
                `This boots the exact, unmodified release binary (no special build), so a failure here reflects the real shipped firmware, not a QEMU-testing-only artifact. Known QEMU-specific limitation: radio_init() always fails in QEMU (no real LoRa hardware) and RollbackGuard's retry-then-halt path is expected to trigger -- this check only flags *unexpected* reset reasons, panics, or an abnormally fast reset rate, not that expected retry behavior.`,
                ``,
                `Last seen ${new Date().toISOString().slice(0,10)} in ${runUrl}.`,
              ].join('\n');
              if (existing) {
                await github.rest.issues.update({ ...repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ ...repo, title, body, labels: ['qemu-boot-check'] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ ...repo, issue_number: existing.number,
                body: `\`${board}\`/\`${variant}\` boots cleanly again as of ${runUrl} -- closing.` });
              await github.rest.issues.update({ ...repo, issue_number: existing.number, state: 'closed' });
            }
