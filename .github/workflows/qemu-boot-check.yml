name: qemu-boot-check

# Boots the shipped firmware vendored under pages/flasher/ in QEMU and holds a conversation
# with it -- the real binary, byte for byte. The emulator models the LoRa radio, the flash and
# the SoC's USB console, so a pass means the node reached its command loop and answered.
# See scripts/qemu_boot_check.py for what is asked of each image.

on:
  workflow_run:
    workflows: ["build-release"]
    types: [completed]
  workflow_dispatch:

env:
  # Our build of espressif/qemu, carrying the device models these images need. Stock
  # espressif builds have no LoRa radio, so the firmware never leaves radio_init().
  QEMU_REPO: HeyVern/espressif-qemu
  QEMU_TAG: v9.2.2

jobs:
  boot-check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        board: [heltec_v4, xiao_c3]
        variant: [repeater, room_server]
        include:
          - board: heltec_v4
            mcu: esp32s3
            binary: qemu-system-xtensa
            machine: esp32s3
            mem: 8M
          - board: xiao_c3
            mcu: esp32c3
            binary: qemu-system-riscv32
            machine: esp32c3
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      # The tarball carries the boot ROMs alongside the binary. Verified against the
      # digest GitHub records for the asset, which it computes from what it stored.
      - name: Fetch qemu for ${{ matrix.mcu }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgcrypt20 libpixman-1-0 libsdl2-2.0-0 zstd
          asset="${{ matrix.mcu }}-${QEMU_TAG}-linux-x86_64.tar.zst"
          expected=$(gh api "repos/${QEMU_REPO}/releases/tags/${QEMU_TAG}" \
            --jq ".assets[] | select(.name==\"${asset}\") | .digest" | sed 's/^sha256://')
          gh release download "${QEMU_TAG}" --repo "${QEMU_REPO}" -p "$asset"
          echo "${expected}  ${asset}" | sha256sum -c -
          tar xaf "$asset"

      - id: boot
        name: Boot ${{ matrix.board }}/${{ matrix.variant }} and exercise its CLI
        run: |
          mkdir -p workdir
          python3 scripts/qemu_boot_check.py \
            --board-id ${{ matrix.board }} \
            --variant ${{ matrix.variant }} \
            --boards-json pages/flasher/auto_boards.json \
            --flasher-dir pages/flasher \
            --qemu-bin "${{ matrix.mcu }}-${QEMU_TAG}-linux-x86_64/${{ matrix.binary }}" \
            --machine ${{ matrix.machine }} \
            --mem "${{ matrix.mem }}" \
            --rom-dir "${{ matrix.mcu }}-${QEMU_TAG}-linux-x86_64/pc-bios" \
            --workdir workdir

      - name: Upload serial capture on failure
        if: failure() && steps.boot.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: qemu-boot-check-${{ matrix.board }}-${{ matrix.variant }}-serial-log
          path: workdir/uart0.log
          retention-days: 14

      # One long-lived issue per variant, and only for a real failure -- a broken
      # emulator fetch fails loudly rather than being filed against the firmware.
      - name: Open, update, or close the tracking issue
        if: always() && steps.boot.outcome != 'skipped'
        uses: actions/github-script@v9
        env:
          FAILED: ${{ steps.boot.outcome == 'failure' }}
        with:
          script: |
            const failed = process.env.FAILED === 'true';
            const board = '${{ matrix.board }}';
            const variant = '${{ matrix.variant }}';
            const title = `[${board}/${variant}] QEMU boot check failed`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            const existing = (await github.rest.issues.listForRepo({
              ...repo, state: 'open', labels: 'qemu-boot-check',
            })).data.find(i => i.title === title);

            if (failed) {
              const body = [
                `The published \`${board}\`/\`${variant}\` release firmware failed the QEMU boot check -- see the captured boot output, uploaded as an artifact on the run below.`,
                ``,
                `This boots the exact, unmodified release binary and talks to its CLI over the emulated USB console. A pass means the node reached its command loop and answered; a failure means it did not, or answered wrongly. Which commands are asked depends on the mod bits stamped into the image.`,
                ``,
                `Last seen ${new Date().toISOString().slice(0,10)} in ${runUrl}.`,
              ].join('\n');
              if (existing) {
                await github.rest.issues.update({ ...repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ ...repo, title, body, labels: ['qemu-boot-check'] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ ...repo, issue_number: existing.number,
                body: `\`${board}\`/\`${variant}\` boots and answers again as of ${runUrl} -- closing.` });
              await github.rest.issues.update({ ...repo, issue_number: existing.number, state: 'closed' });
            }
