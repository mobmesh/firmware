name: qemu-boot-check

# Boots the exact, unmodified release firmware (as already vendored in pages/flasher/heltec_v4/
# by build-release.yml) in QEMU and watches for a crash/boot loop. No special build -- this is
# the real shipped binary, byte for byte. See .github/scripts/qemu_boot_check.py for what counts
# as a pass/fail.
#
# heltec_v4-only: this uses qemu-system-xtensa, which only supports Xtensa chips. xiao_c3 is
# RISC-V (ESP32-C3) -- a RISC-V-capable QEMU build was already tried for it and couldn't even
# boot a known-good upstream MeshCore binary, so this isn't an unscoped backlog item, it's a
# tried-and-didn't-work path. No automated boot-loop gate for that board until the tooling
# situation actually changes; manual hardware testing is the only verification path for now.

on:
  workflow_run:
    workflows: ["sync-build-release"]
    types: [completed]
  workflow_dispatch:

jobs:
  boot-check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        variant: [repeater, room_server]
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Fetch prebuilt qemu-system-xtensa
        run: |
          git clone --depth 1 --branch prebuilt-binaries https://github.com/HeyVern/Qemu.git qemu-prebuilt
          chmod +x qemu-prebuilt/xtensa-softmmu/linux-x86_64/qemu-system-xtensa

      - name: Fetch ROM binary fresh from the QEMU source repo
        run: |
          git clone --depth 1 --branch esp-develop https://github.com/heyvern/qemu.git qemu-src --filter=blob:none --sparse
          git -C qemu-src sparse-checkout set pc-bios
          mkdir -p rom
          cp qemu-src/pc-bios/esp32s3_rev0_rom.bin rom/

      - name: Boot heltec_v4/${{ matrix.variant }} and check for crash/boot loop
        run: |
          mkdir -p workdir
          python3 .github/scripts/qemu_boot_check.py \
            --board-id heltec_v4 \
            --variant ${{ matrix.variant }} \
            --boards-json pages/flasher/boards.json \
            --flasher-dir pages/flasher \
            --qemu-bin qemu-prebuilt/xtensa-softmmu/linux-x86_64/qemu-system-xtensa \
            --rom-dir rom \
            --workdir workdir

      - name: Upload serial capture on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-boot-check-${{ matrix.variant }}-serial-log
          path: workdir/serial_capture.log
          retention-days: 14

      - name: Open an issue on a detected crash/boot loop
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${{ matrix.variant }}] QEMU boot check failed -- possible crash/boot loop`,
              body: [
                `The published \`heltec_v4\`/\`${{ matrix.variant }}\` release firmware failed the QEMU boot-loop check -- see the workflow run for the captured serial output (also uploaded as an artifact on this run).`,
                ``,
                `This boots the exact, unmodified release binary (no special build), so a failure here reflects the real shipped firmware, not a QEMU-testing-only artifact. Known QEMU-specific limitation: radio_init() always fails in QEMU (no real LoRa hardware) and RollbackGuard's retry-then-halt path is expected to trigger -- this check only flags *unexpected* reset reasons, panics, or an abnormally fast reset rate, not that expected retry behavior.`,
                ``,
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n')
            });
