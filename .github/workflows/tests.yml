name: tests

# scripts/tests/ ran nowhere automated until 2026-08-26. test_patch_ownership.py enforces
# the rule that only shim patches upstream's insertion points, and a broken suite sat on
# main undetected the same day it was written.
on:
  push:
    paths:
      - 'scripts/**'
      - 'mods/**'
      - '.github/scripts/**'
      - 'build-targets.yaml'
      - 'variants/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the tests import
        run: pip install --quiet pyyaml

      - name: Run scripts/tests
        run: python3 -m unittest discover -s scripts/tests -v
