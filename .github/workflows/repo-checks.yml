name: repo-checks
# Without this the run is titled with the commit subject, which says nothing about what ran.
run-name: repo-checks on ${{ github.ref_name }}

# Checks the repo's own contents, not code in isolation: patch ownership, the vendored
# images, the generated board config.
on:
  push:
    paths:
      # Narrow on purpose: the tests read patches, mod manifests and the build config,
      # not prose. `mods/**` fired on a markdown edit under mods/*/docs/ on 2026-08-26.
      - 'scripts/**'
      - 'mods/**/patches/**'
      - 'mods/**/files/**'
      - 'mods/**/mod.yaml'
      - 'build-targets.yaml'
      - 'variants/**/overrides.yaml'
      - '.github/workflows/repo-checks.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  checks:
    name: patches, config, images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install what the tests import
        run: pip install --quiet pyyaml

      - id: run
        name: Run scripts/tests
        run: |
          if python3 -m unittest discover -s scripts/tests -v > checks.log 2>&1; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          cat checks.log
          # generate-board-config prints its own OK: lines after the unittest summary,
          # so an unfiltered tail buries the failure it is supposed to show.
          { echo 'summary<<LOG_EOF'
            grep -vE '^OK: (injected|updated)' checks.log | tail -40
            echo 'LOG_EOF'; } >> "$GITHUB_OUTPUT"
          { echo '```'; cat checks.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # One long-lived tracking issue, closed automatically when the checks pass again --
      # the same shape patch-drift-canary uses, so a fixed failure does not linger.
      - name: Open, update, or close the tracking issue
        uses: actions/github-script@v9
        env:
          FAILED: ${{ steps.run.outputs.failed }}
          SUMMARY: ${{ steps.run.outputs.summary }}
        with:
          script: |
            const failed = process.env.FAILED === 'true';
            const title = 'repo-checks failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'These read the repo\'s own contents -- patch ownership, the vendored images,',
              'the generated board config -- so a failure means the tree is inconsistent,',
              'not that a function is broken.',
              '',
              '```', process.env.SUMMARY, '```',
              '',
              `From ${context.sha.slice(0, 7)} on \`${context.ref.replace('refs/heads/', '')}\`, [run](${runUrl}).`,
              'Closes itself when the checks pass again.',
            ].join('\n');

            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'repo-checks',
            })).data.find(i => i.title === title);

            if (failed) {
              if (existing) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: ['repo-checks'] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Checks pass again as of ${runUrl} -- closing.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed' });
            }

      - name: Fail the job if the checks failed
        if: steps.run.outputs.failed == 'true'
        run: exit 1
