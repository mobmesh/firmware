name: qemu-scratch-build

# Scratch, manual-only build for QEMU testing. Not part of the release process -- builds
# heltec_v4_repeater with two QEMU-only overrides real builds never set: console forced onto
# UART0 (real hardware uses native USB-CDC, which this QEMU fork's USB-Serial-JTAG device
# doesn't emulate), and RollbackGuard's radio-init-failure handling turned into a no-op via
# QEMU_TEST_BUILD (see src/helpers/esp32/RollbackGuard.cpp -- there's no real LoRa radio in
# QEMU, so without this the firmware reboot-loops forever and setup() never finishes).

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream tag/branch to build against'
        required: false
        default: ''

env:
  UPSTREAM_REPO: meshcore-dev/MeshCore

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (patches only)
        uses: actions/checkout@v4

      - id: pick
        name: Resolve upstream ref
        run: |
          if [ -n "${{ github.event.inputs.upstream_ref }}" ]; then
            REF="${{ github.event.inputs.upstream_ref }}"
          else
            REF=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases" \
              | jq -r '[.[] | select(.tag_name | startswith("repeater-v"))][0].tag_name')
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream at resolved ref
        run: |
          git clone --depth 50 https://github.com/${{ env.UPSTREAM_REPO }}.git upstream-src
          cd upstream-src
          git checkout "${{ steps.pick.outputs.ref }}"

      - name: Apply maintained patches in order
        run: |
          cd upstream-src
          for patch in ../patches/*.patch; do
            git apply --check "$patch" || { echo "::error::$patch does not apply"; exit 1; }
            git apply "$patch"
          done

      - name: Set up PlatformIO
        run: pip install --upgrade platformio

      - name: Build (console forced onto UART0, radio-init failure bypassed -- both QEMU-only)
        run: |
          cd upstream-src
          PLATFORMIO_BUILD_FLAGS="-DARDUINO_USB_CDC_ON_BOOT=0 -DQEMU_TEST_BUILD=1" \
            pio run -e heltec_v4_repeater

      - name: Collect build outputs
        run: |
          cd upstream-src
          mkdir -p ../out
          cp .pio/build/heltec_v4_repeater/firmware.bin ../out/
          cp .pio/build/heltec_v4_repeater/bootloader.bin ../out/
          cp .pio/build/heltec_v4_repeater/partitions.bin ../out/

      - name: Push build outputs to a scratch branch (Actions artifacts aren't reachable from the dev sandbox)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B qemu-scratch-output
          git add -f out/
          git commit -m "qemu-scratch-build output ($(date -u +%FT%TZ))"
          git push -f origin qemu-scratch-output
