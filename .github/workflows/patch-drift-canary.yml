# Early warning for patch drift. Never builds, never publishes.
#
# build-release only notices drift when upstream tags a release, so this probes the moving
# branches daily. It also flags patches duplicating a merged fix, which still apply cleanly.
name: patch-drift-canary

on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: meshcore-dev/MeshCore
  ISSUE_TITLE: "Patch drift against upstream branches"
  CANARY_EXTRA_MODS: sync-settings

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (patches only)
        uses: actions/checkout@v7

      - id: probe
        name: Probe patches against upstream branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet pyyaml==6.0.3
          REPORT=report.md
          EXPLAIN=explain.md
          : > "$REPORT"
          : > "$EXPLAIN"
          DRIFT=false

          # --- 1. do the patches still apply? -------------------------------------
          # The ordered union, so target-specific mods are included without applying
          # any patch twice.
          MODS=$(printf '%s\n' \
            "$(python3 scripts/generate-board-config.py project-info --field ordered-mods)" \
            "$CANARY_EXTRA_MODS" | tr ' ' '\n' | awk 'NF && !seen[$0]++' | xargs)
          echo "mods: $MODS"
          # The release build-release builds from; the command contracts are taken from it.
          BASE=$(gh api "repos/${UPSTREAM_REPO}/releases" \
            --jq '[.[] | select(.tag_name | startswith("repeater-v"))][0].tag_name' 2>/dev/null || true)
          [ -n "$BASE" ] || BASE=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" 'repeater-v*' \
            | sed 's|.*refs/tags/||' | sort -V | tail -1)
          echo "base: $BASE"
          BOARDS=$(python3 scripts/generate-board-config.py resolve-targets \
            | python3 -c "import json,sys; print(','.join(sorted({t['board_id'] for t in json.load(sys.stdin)['include']})))")
          CONTRACTS=contracts.md
          : > "$CONTRACTS"

          # Conflicts resolve to upstream's side, or the patch drags the old base back in.
          # Never --depth 1: three-way silently degrades without the preimage blobs.
          for ref in main dev; do
            rm -rf probe-src
            git clone --quiet --branch "$ref" \
              "https://github.com/${UPSTREAM_REPO}.git" probe-src 2>/dev/null || {
                echo "- \`$ref\`: **could not clone** (branch missing?)" >> "$REPORT"
                continue
              }
            sha=$(git -C probe-src rev-parse --short HEAD)
            # Replaying the series on the release writes each patch's preimage blobs, which three-way needs.
            rm -rf seed-src
            git -C probe-src worktree add --quiet --detach ../seed-src "$BASE"
            python3 scripts/generate-board-config.py copy-src \
              --upstream seed-src --mods "$(echo $MODS | tr ' ' ',')" >/dev/null
            python3 scripts/generate-board-config.py compose-mods \
              --upstream seed-src --mods "$(echo $MODS | tr ' ' ',')" >/dev/null
            git -C seed-src add -A
            for mod in $MODS; do
              for patch in "mods/$mod/patches"/*.patch; do
                [ -e "$patch" ] || continue
                if git -C seed-src apply "../$patch"; then
                  git -C seed-src add -A
                else
                  echo "- \`$mod/$(basename "$patch")\` does not apply to \`$BASE\` itself -- its three-way results below are unreliable" >> "$REPORT"
                  DRIFT=true
                fi
              done
            done
            git -C probe-src worktree remove --force ../seed-src
            python3 scripts/generate-board-config.py copy-src \
              --upstream probe-src --mods "$(echo $MODS | tr ' ' ',')" >/dev/null
            python3 scripts/generate-board-config.py compose-mods \
              --upstream probe-src --mods "$(echo $MODS | tr ' ' ',')" >/dev/null
            placed=""       # three-way relocated it unaided
            conflicted=""   # three-way left markers
            for mod in $MODS; do
              for patch in "mods/$mod/patches"/*.patch; do
                [ -e "$patch" ] || continue
                name="$mod/$(basename "$patch")"
                if git -C probe-src apply --check "../$patch" 2>/dev/null; then
                  git -C probe-src apply "../$patch"
                  continue
                fi
                # Before three-way touches anything: a half-merged tree no longer shows
                # where upstream put the code.
                base=$(git -C probe-src describe --tags --abbrev=0 --match 'repeater-v*' 2>/dev/null || true)
                {
                  echo "<details><summary><code>$name</code> -- what moved</summary>"
                  echo
                  python3 scripts/explain_patch_drift.py \
                    --tree probe-src --patch "$patch" --ref "$ref" --base "$base" || true
                  echo
                  echo "</details>"
                } >> "$EXPLAIN"

                err=$(git -C probe-src apply -3 "../$patch" 2>&1) || true
                # Still missing after seeding means the patch was cut against a tree nobody can rebuild.
                if echo "$err" | grep -q "lacks the necessary blob"; then
                  echo "::warning::$name: preimage blob missing -- regenerate the patch against $BASE" >&2
                  conflicted="$conflicted $name(no-preimage)"
                  continue
                fi
                unmerged=$(git -C probe-src diff --name-only --diff-filter=U)
                if [ -n "$unmerged" ]; then
                  conflicted="$conflicted $name"
                  for f in $unmerged; do
                    git -C probe-src checkout --ours -- "$f" 2>/dev/null || true
                    git -C probe-src add "$f"
                  done
                else
                  placed="$placed $name"
                fi
              done
            done
            if [ "$ref" = dev ]; then
              echo "dev_sha=$sha" >> "$GITHUB_OUTPUT"
              [ -z "$conflicted" ] && echo "dev_buildable=true" >> "$GITHUB_OUTPUT" \
                                   || echo "dev_buildable=false" >> "$GITHUB_OUTPUT"
              rm -rf dev-src && cp -a probe-src dev-src
            fi
            # Commands move without conflicting, so a rename or a move to another board is only visible here.
            rc=0
            python3 scripts/check_command_contracts.py --tree probe-src --base "$BASE" \
              --head HEAD --ref "$ref" --boards "$BOARDS" >> "$CONTRACTS" || rc=$?
            [ "$rc" = 2 ] && DRIFT=true
            [ "$rc" != 0 ] && [ "$rc" != 2 ] && echo "- \`$ref\`: command contract check **crashed** (exit $rc) -- see the run log" >> "$CONTRACTS"
            if [ -z "$placed$conflicted" ]; then
              echo "- \`$ref\` (\`$sha\`): all patches apply" >> "$REPORT"
            else
              DRIFT=true
              echo "- \`$ref\` (\`$sha\`): **DRIFT**" >> "$REPORT"
              [ -n "$conflicted" ] && echo "  - **needs a person**:$conflicted" >> "$REPORT"
              [ -n "$placed" ] && echo "  - three-way relocates unaided:$placed" >> "$REPORT"
              [ -n "$conflicted" ] && echo "  - patches after the first conflict were applied to a tree missing its hunks; treat their results as provisional" >> "$REPORT"
            fi
          done

          # --- 2. has a carried upstream PR been merged? ---------------------------
          # Sidecars may declare `upstream_prs: [1972, 1349]`. A merged PR means the patch
          # carrying it wants re-review, not just a rebase.
          PRS=$(python3 scripts/generate-board-config.py project-info --field upstream-prs)
          for entry in $PRS; do
            patch="${entry%%:*}"; pr="${entry##*:}"
            state=$(gh api "repos/${UPSTREAM_REPO}/pulls/${pr}" \
              --jq 'if .merged then "MERGED" else .state end' 2>/dev/null || echo "unknown")
            if [ "$state" = "MERGED" ]; then
              DRIFT=true
              echo "- \`$patch\` carries upstream PR #${pr}, which is now **MERGED** -- the patch may be redundant" >> "$REPORT"
            else
              echo "- \`$patch\` carries upstream PR #${pr} (${state}) -- still needed" >> "$REPORT"
            fi
          done

          # --- 3. has an overridden upstream default changed? ----------------------
          # ADC_MULTIPLIER is overridden with a bench-measured value, which silently masks
          # any upstream revision. Worth re-measuring, not worth failing a build over.
          EXPECTED_ADC_MULT=5.42
          if [ -d probe-src ]; then
            found=$(grep -oE '^ *# *define +ADC_MULTIPLIER +[0-9.]+' \
              probe-src/variants/heltec_v4/HeltecV4Board.h 2>/dev/null \
              | grep -oE '[0-9.]+$' || echo "")
            if [ -z "$found" ]; then
              DRIFT=true
              echo "- upstream's \`ADC_MULTIPLIER\` default could not be found in HeltecV4Board.h -- the override may no longer apply" >> "$REPORT"
            elif [ "$found" != "$EXPECTED_ADC_MULT" ]; then
              DRIFT=true
              echo "- upstream changed \`ADC_MULTIPLIER\` from ${EXPECTED_ADC_MULT} to ${found}; the override stays 5.32 (bench-measured) -- worth re-measuring" >> "$REPORT"
            else
              echo "- upstream \`ADC_MULTIPLIER\` still ${found}; overridden with 5.32 (bench-measured)" >> "$REPORT"
            fi
          fi

          # --- 4. does upstream still sleep the radio the way power-guard assumes? --
          # power-guard's poweroff relies on radio_driver.powerOff() reaching the SX1262's
          # sleep. Losing it costs current through a hibernation, not the node: warn only.
          if [ -d probe-src ] && echo " $MODS " | grep -q " power-guard "; then
            if grep -qE 'sleep\(false\)' \
              probe-src/src/helpers/radiolib/CustomSX1262Wrapper.h 2>/dev/null; then
              echo "- upstream \`CustomSX1262Wrapper::powerOff()\` still sleeps the SX1262; power-guard's poweroff path relies on it" >> "$REPORT"
            else
              DRIFT=true
              echo "- upstream \`CustomSX1262Wrapper::powerOff()\` no longer calls \`sleep(false)\` -- power-guard's poweroff path may leave the radio awake (see mods/power-guard/README.md)" >> "$REPORT"
            fi
          fi

          # --- 5. does upstream still serial-gate the stats commands? ---------------
          # power-guard forwards these over the mesh by re-dispatching with timestamp 0.
          # A rename, a removal, or a second gate breaks that silently: no patch conflicts
          # and the tree still compiles, so only a grep catches it.
          if [ -d probe-src ] && echo " $MODS " | grep -q " power-guard "; then
            for cmd in stats-core stats-radio stats-packets; do
              len=${#cmd}
              if grep -qE "sender_timestamp == 0 && memcmp\\(command, \"$cmd\", $len\\)" \
                probe-src/src/helpers/CommonCLI.cpp 2>/dev/null; then
                echo "- upstream still serial-gates \`$cmd\` on \`sender_timestamp == 0\`; power-guard's remote forward relies on it" >> "$REPORT"
              else
                DRIFT=true
                echo "- upstream's \`$cmd\` serial gate changed shape -- power-guard may forward a command that no longer exists, or one that is now blocked for another reason (see mods/power-guard/README.md)" >> "$REPORT"
              fi
            done
          fi

          # --- 6. do sync-settings' room-server assumptions still hold? ------------
          # The repeat.gate patch adds one line to the room server's allowPacketForward and
          # reads state upstream owns. None of the four below conflict when they change.
          if [ -d probe-src ] && echo " $MODS " | grep -q " sync-settings "; then
            ROOM=probe-src/examples/simple_room_server/MyMesh.cpp
            # Upstream fixing the repeater/room-server asymmetry itself makes the repeat.gate patch redundant.
            if grep -qE 'recv_pkt_region == NULL' "$ROOM" 2>/dev/null; then
              DRIFT=true
              echo "- upstream's room-server \`allowPacketForward\` now bails on \`recv_pkt_region == NULL\` itself -- the repeat.gate patch is likely redundant, and \`set repeat.gate off\` may no longer disable gating (see mods/sync-settings/README.md)" >> "$REPORT"
            else
              echo "- upstream's room server still forwards regardless of region; the repeat.gate patch is still needed" >> "$REPORT"
            fi
            # The gate reads this to decide scope; a rename compiles but measures the wrong thing.
            if grep -q 'recv_pkt_region' "$ROOM" 2>/dev/null; then
              echo "- upstream's room server still tracks \`recv_pkt_region\`; repeat.gate depends on it" >> "$REPORT"
            else
              DRIFT=true
              echo "- upstream's room server no longer tracks \`recv_pkt_region\` -- repeat.gate's scope test has lost its input" >> "$REPORT"
            fi
            # repeat.gate is subtractive only because disable_fwd is tested first.
            if grep -A 2 'bool MyMesh::allowPacketForward' "$ROOM" 2>/dev/null | grep -q '_prefs.disable_fwd'; then
              echo "- upstream's room server still tests \`disable_fwd\` first; repeat.gate stays inert behind \`repeat off\`" >> "$REPORT"
            else
              DRIFT=true
              echo "- upstream's room server no longer tests \`disable_fwd\` first in \`allowPacketForward\` -- repeat.gate may now affect a node with repeating off" >> "$REPORT"
            fi
            # sync-settings claims 'set repeat on' to append a notice; a rename drops it silently.
            if grep -qE 'memcmp\(config, "repeat ", 7\)' probe-src/src/helpers/CommonCLI.cpp 2>/dev/null; then
              echo "- upstream still parses \`set repeat <on|off>\`; sync-settings' repeat.gate notice relies on it" >> "$REPORT"
            else
              DRIFT=true
              echo "- upstream's \`set repeat\` parser changed shape -- sync-settings' repeat.gate notice will stop appending, silently" >> "$REPORT"
            fi
            # ROOM_PASSWORD is how the mod compiles the notice into room servers only.
            if grep -q 'ROOM_PASSWORD' probe-src/variants/heltec_v4/platformio.ini 2>/dev/null; then
              echo "- \`ROOM_PASSWORD\` still marks the room-server env; sync-settings uses it to target the repeat.gate notice" >> "$REPORT"
            else
              DRIFT=true
              echo "- \`ROOM_PASSWORD\` no longer marks the heltec_v4 room-server env -- sync-settings' repeat.gate notice will compile out of every build" >> "$REPORT"
            fi
          fi

          # --- 7. do the upstream commands our mods send or intercept still exist? --
          cat "$CONTRACTS" >> "$REPORT"

          echo "drift=$DRIFT" >> "$GITHUB_OUTPUT"
          # Appended, not merged into $REPORT: the explanations are collapsed detail under
          # the summary lines, and only exist when something failed.
          cat "$EXPLAIN" >> "$REPORT"
          { echo 'report<<REPORT_EOF'; cat "$REPORT"; echo 'REPORT_EOF'; } >> "$GITHUB_OUTPUT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      # Applying and compiling are different questions: a patch can apply against a tree
      # that has deleted the virtual it calls. The widest composition per upstream role,
      # since shim bridges are implemented separately in both. Drift only if vanilla builds.
      # One build per chip family too: toolchains break separately, boards of one family rarely do.
      - id: buildcheck
        name: Build the patched tree against dev
        if: steps.probe.outputs.dev_buildable == 'true'
        continue-on-error: true
        run: |
          pip install --quiet platformio==6.1.19
          # FEM bypass on: it is off in every shipped build, so a default build would
          # preprocess away the code that broke.
          FLAGS="-D 'OTA_MOD_BUILD_DATE=\"canary\"' -D 'OTA_MOD_SHORT_SHA=\"canary\"' -D MOBMESH_BUILD_EPOCH=$(date -u +%s) -D POWER_GUARD_AUTO_DROP_FEM_LNA=1"
          SPECS=$(python3 scripts/generate-board-config.py resolve-targets | python3 -c "
          import json, os, sys, yaml
          targets = json.load(sys.stdin)['include']
          extras = os.environ.get('CANARY_EXTRA_MODS', '').split()
          def family(board):
              with open(f'variants/{board}/overrides.yaml') as f:
                  return ((yaml.safe_load(f) or {}).get('qemu') or {}).get('mcu') or board
          groups = {}
          for t in targets:
              groups.setdefault((t['role'], family(t['board_id'])), []).append(t)
          for key in sorted(groups):
              t = max(groups[key], key=lambda x: len(x['mods']))
              mods = list(dict.fromkeys(t['mods'] + extras))
              print('|'.join([','.join(mods), t['board_id'], t['build_env']]))
          ")
          FAILED=""
          for SPEC in $SPECS; do
            mods=${SPEC%%|*}; rest=${SPEC#*|}; board=${rest%%|*}; env=${rest##*|}
            # The probe composed hooks for the union of mods; a target without one of them cannot link that.
            rm -f dev-src/src/helpers/ModHooks.cpp dev-src/src/helpers/esp32/CommonCliMods.cpp
            python3 scripts/generate-board-config.py compose-mods --upstream dev-src --mods "$mods" >/dev/null
            python3 scripts/generate-board-config.py inject-env \
              --board "$board" --env "$env" \
              --platformio-ini "dev-src/variants/$board/platformio.ini" --mods "$mods"
            if ! (cd dev-src && PLATFORMIO_BUILD_FLAGS="$FLAGS" pio run -e "$env" > "../patched-$env.log" 2>&1); then
              tail -30 "patched-$env.log"
              FAILED="$FAILED $SPEC"
            fi
          done
          if [ -z "$FAILED" ]; then
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf vanilla-src
          git clone --quiet --branch dev "https://github.com/${UPSTREAM_REPO}.git" vanilla-src
          VERDICT=upstream
          for SPEC in $FAILED; do
            rest=${SPEC#*|}; env=${rest##*|}
            if (cd vanilla-src && pio run -e "$env" > "../vanilla-$env.log" 2>&1); then
              VERDICT=patches
            else
              tail -30 "vanilla-$env.log"
            fi
          done
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      # One long-lived tracking issue rather than a new one per day.
      - name: Open, update, or close the tracking issue
        uses: actions/github-script@v9
        env:
          REPORT: ${{ steps.probe.outputs.report }}
        with:
          script: |
            const verdict = '${{ steps.buildcheck.outputs.verdict }}';
            const buildLine = {
              ok:       '- `dev`: patched tree **builds**',
              patches:  '- `dev`: patched tree **FAILS TO BUILD** and the same ref builds vanilla -- the break is in the patches',
              upstream: '- `dev`: patched tree fails to build, but so does vanilla -- upstream is broken today',
              '':       '- `dev`: build check skipped (patches need resolving first)',
            }[verdict] ?? '- `dev`: build check did not report';
            const drift = ${{ steps.probe.outputs.drift }} || verdict === 'patches';
            // Through env, not template interpolation: a backtick in the report used to
            // terminate the literal and fail the job with a JS syntax error.
            const report = process.env.REPORT + '\n' + buildLine;
            const title = process.env.ISSUE_TITLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${report}\n\nChecked ${new Date().toISOString().slice(0,10)} by [patch-drift-canary](${runUrl}).\n\nThis is a warning, not a build failure -- releases still build from tagged upstream refs.`;

            const existing = (await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'patch-drift',
            })).data.find(i => i.title === title);

            if (drift) {
              if (existing) {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: ['patch-drift'] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `Patches apply cleanly again as of ${runUrl} -- closing.\n\n${report}` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed' });
            }
