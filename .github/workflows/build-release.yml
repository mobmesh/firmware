name: sync-build-release

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '0 6 * * *'   # daily poll for new upstream repeater-vX.Y.Z tags
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream tag/branch to build against (blank = auto-detect latest repeater-v* tag)'
        required: false
        default: ''

env:
  UPSTREAM_REPO: meshcore-dev/MeshCore
  PATCH_FILE: patches/0001-hotspot-fetch-ota.patch
  BUILD_ENV: heltec_v4_repeater

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      release_tag: ${{ steps.pick.outputs.release_tag }}
      already_built: ${{ steps.check.outputs.exists }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.upstream_ref }}" ]; then
            REF="${{ github.event.inputs.upstream_ref }}"
          else
            REF=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases" \
              | jq -r '[.[] | select(.tag_name | startswith("repeater-v"))][0].tag_name')
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "release_tag=hotspot-ota-$REF" >> "$GITHUB_OUTPUT"
      - id: check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.pick.outputs.release_tag }}")
          if [ "$STATUS" = "200" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: resolve-ref
    if: needs.resolve-ref.outputs.already_built == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (patches only)
        uses: actions/checkout@v4

      - name: Checkout upstream at resolved ref
        run: |
          git clone --depth 50 https://github.com/${{ env.UPSTREAM_REPO }}.git upstream-src
          cd upstream-src
          git checkout "${{ needs.resolve-ref.outputs.ref }}"

      - name: Apply maintained patch (fail loudly on drift, do not attempt auto-merge)
        run: |
          cd upstream-src
          git apply --check ../${{ env.PATCH_FILE }} || {
            echo "::error::Patch no longer applies cleanly against ${{ needs.resolve-ref.outputs.ref }}. Manual rebase required."
            exit 1
          }
          git apply ../${{ env.PATCH_FILE }}

      - name: Set up PlatformIO
        run: |
          pip install --upgrade platformio

      - name: Build
        run: |
          cd upstream-src
          pio run -e ${{ env.BUILD_ENV }}

      - name: Sync docs/cli-additions.md from the patch's actual effect
        run: |
          cd upstream-src
          {
            echo "<!-- AUTO-GENERATED by .github/workflows/build-release.yml -- do not edit directly."
            echo "     Source: patches/0001-hotspot-fetch-ota.patch applied against ${{ needs.resolve-ref.outputs.ref }}."
            echo "     To change this content, edit the patch and let the next build regenerate this file. -->"
            echo ""
            echo "# CLI commands added by this patch"
            echo ""
            echo "This is the exact documentation \`patches/0001-hotspot-fetch-ota.patch\` adds to MeshCore's own"
            echo "\`docs/cli_commands.md\`, extracted from the last successful build against"
            echo "\`${{ needs.resolve-ref.outputs.ref }}\`."
            echo ""
            echo "---"
            git diff HEAD -- docs/cli_commands.md | grep '^+' | grep -v '^+++' | sed 's/^+//'
          } > ../docs/cli-additions.md

      - name: Commit updated docs/cli-additions.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cli-additions.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: sync cli-additions.md with ${{ needs.resolve-ref.outputs.ref }}"
            git push
          fi

      - name: Locate app-only .bin (not the merged/full-flash image)
        id: artifact
        run: |
          cd upstream-src
          BIN=".pio/build/${{ env.BUILD_ENV }}/firmware.bin"
          test -f "$BIN"
          VERSION="${{ needs.resolve-ref.outputs.ref }}"
          VERSION="${VERSION#repeater-}"   # strip the "repeater-" tag prefix, keep just "vX.Y.Z"
          NAME="heltec_v4_rep_ota_mod-${VERSION}.bin"
          cp "$BIN" "../$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 sidecar
        run: |
          sha256sum "${{ steps.artifact.outputs.name }}" | awk '{print $1}' > "${{ steps.artifact.outputs.name }}.sha256"

      - name: Publish release with .bin + .sha256 sidecar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-ref.outputs.release_tag }}
          name: "Hotspot-OTA build (${{ needs.resolve-ref.outputs.ref }})"
          files: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256

  notify-patch-failure:
    needs: [resolve-ref, build]
    if: failure() && needs.resolve-ref.outputs.already_built == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Patch or build failed against ${{ needs.resolve-ref.outputs.ref }}`,
              body: `sync-build-release failed for upstream ref \`${{ needs.resolve-ref.outputs.ref }}\`. Check the workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
