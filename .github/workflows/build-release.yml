name: sync-build-release

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '0 6 * * *'   # daily poll for new upstream tags across all variants
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream tag/branch to build against (blank = auto-detect latest tag per variant). Applies to whichever variant(s) this run builds.'
        required: false
        default: ''
      variant:
        description: 'Limit this run to a single variant id, e.g. repeater or room_server (blank = build all variants)'
        required: false
        default: ''
      force_rebuild:
        description: 'Rebuild and republish even if a release already exists for the resolved tag (manual runs only -- the scheduled poll always respects the existing-release check)'
        required: false
        type: boolean
        default: false

env:
  UPSTREAM_REPO: meshcore-dev/MeshCore

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: repeater
            build_env: heltec_v4_repeater
            upstream_tag_prefix: repeater
            release_title: Repeater
            asset_basename: heltec_v4_rep_ota
            sync_docs: true
          - id: room_server
            build_env: heltec_v4_room_server
            upstream_tag_prefix: room-server
            release_title: Room
            asset_basename: heltec_v4_room_ota
            sync_docs: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (patches only)
        uses: actions/checkout@v4

      - id: filter
        name: Check whether this variant is in scope for this run
        run: |
          if [ -n "${{ github.event.inputs.variant }}" ] && [ "${{ github.event.inputs.variant }}" != "${{ matrix.id }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - id: pick
        name: Resolve upstream ref for ${{ matrix.id }}
        if: steps.filter.outputs.skip == 'false'
        run: |
          if [ -n "${{ github.event.inputs.upstream_ref }}" ]; then
            REF="${{ github.event.inputs.upstream_ref }}"
          else
            REF=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases" \
              | jq -r '[.[] | select(.tag_name | startswith("${{ matrix.upstream_tag_prefix }}-v"))][0].tag_name')
          fi
          if [ -z "$REF" ] || [ "$REF" = "null" ]; then
            echo "::error::No upstream ${{ matrix.upstream_tag_prefix }}-v* release found."
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${REF#${{ matrix.upstream_tag_prefix }}-}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${REF}-ota_mod" >> "$GITHUB_OUTPUT"

      - id: check
        name: Check if already built
        if: steps.filter.outputs.skip == 'false'
        run: |
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.pick.outputs.release_tag }}")
          if [ "$STATUS" = "200" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Fetch upstream release notes
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        run: |
          BODY=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/tags/${{ steps.pick.outputs.ref }}" \
            | jq -r '.body // ""')
          {
            echo "Built from [\`${{ steps.pick.outputs.ref }}\`](https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ steps.pick.outputs.ref }}) of upstream MeshCore."
            echo ""
            echo "## Upstream release notes"
            echo ""
            if [ -n "$BODY" ]; then
              echo "$BODY"
            else
              echo "_Upstream published no release notes for this tag._"
            fi
          } > release-notes.md

      - name: Checkout upstream at resolved ref
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        run: |
          git clone --depth 50 https://github.com/${{ env.UPSTREAM_REPO }}.git upstream-src
          cd upstream-src
          git checkout "${{ steps.pick.outputs.ref }}"

      - name: Apply maintained patches in order (fail loudly on drift, do not attempt auto-merge)
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        run: |
          cd upstream-src
          for patch in ../patches/*.patch; do
            git apply --check "$patch" || {
              echo "::error::$patch no longer applies cleanly against ${{ steps.pick.outputs.ref }}. Manual rebase required."
              exit 1
            }
            git apply "$patch"
          done

      - name: Set up PlatformIO
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        run: |
          pip install --upgrade platformio

      - name: Build
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        run: |
          cd upstream-src
          OTA_MOD_DATE="$(date -u +"%-d %b %Y") $(git -C .. rev-parse --short HEAD)"
          PLATFORMIO_BUILD_FLAGS="-D 'OTA_MOD_BUILD_DATE=\"$OTA_MOD_DATE\"'" \
            pio run -e ${{ matrix.build_env }}

      - id: rollback_check
        name: Verify RollbackGuard's core hook still exists and is called (catches silent drift before it ships)
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        run: |
          FRAMEWORK_DIR=$(find "$HOME/.platformio/packages" -maxdepth 1 -iname 'framework-arduinoespressif32*' | head -1)
          HITS=$([ -n "$FRAMEWORK_DIR" ] && grep -ro "verifyRollbackLater" "$FRAMEWORK_DIR" | wc -l || echo 0)
          echo "verifyRollbackLater occurrences in installed core: $HITS"
          # Expect >=2: one for the weak prototype, one for the actual call site inside initArduino().
          # A count of 1 means it's declared but no longer referenced anywhere -- our override would
          # link fine and simply never run, which link success alone would not catch.
          if [ -z "$FRAMEWORK_DIR" ] || [ "$HITS" -lt 2 ]; then
            echo "::error::verifyRollbackLater() found $HITS time(s) in the installed Arduino-ESP32 core ($FRAMEWORK_DIR), expected >=2 (declaration + call site)."
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Notify on rollback-guard hook drift
        if: failure() && steps.rollback_check.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${{ matrix.id }}] verifyRollbackLater() no longer found/called in the Arduino-ESP32 core`,
              body: [
                `The \`${{ matrix.id }}\` build failed because the installed Arduino-ESP32 core no longer declares and calls \`verifyRollbackLater()\` (see \`src/helpers/esp32/RollbackGuard.cpp\`). This usually means a core version bump changed how OTA rollback confirmation works, and \`RollbackGuard\`'s override may have silently stopped taking effect.`,
                ``,
                `**To fix:**`,
                `1. Check the installed core's \`cores/esp32/esp32-hal-misc.c\` (or wherever \`initArduino()\` now lives) for how it confirms/defers OTA rollback.`,
                `2. Update \`verifyRollbackLater()\` in \`RollbackGuard.cpp\` to match the new mechanism, if an equivalent hook still exists.`,
                `3. If the core dropped app-rollback confirmation control entirely, this feature needs a bigger rework -- see "Automatic rollback protection" in README.md.`,
                ``,
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n')
            });

      - name: Sync docs/cli-additions.md from the patches' actual effect
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false' && matrix.sync_docs
        run: |
          cd upstream-src
          {
            echo "<!-- AUTO-GENERATED by .github/workflows/build-release.yml -- do not edit directly."
            echo "     Source: patches/*.patch (applied in order) against ${{ steps.pick.outputs.ref }}."
            echo "     To change this content, edit the relevant patch and let the next build regenerate this file. -->"
            echo ""
            echo "# CLI commands added by these patches"
            echo ""
            echo "This is the exact documentation \`patches/*.patch\` adds to MeshCore's own"
            echo "\`docs/cli_commands.md\`, extracted from the last successful build against"
            echo "\`${{ steps.pick.outputs.ref }}\`."
            echo ""
            echo "---"
            git diff HEAD -- docs/cli_commands.md | grep '^+' | grep -v '^+++' | sed 's/^+//'
          } > ../docs/cli-additions.md

      - name: Commit updated docs/cli-additions.md if changed
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false' && matrix.sync_docs
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/cli-additions.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: sync cli-additions.md with ${{ steps.pick.outputs.ref }}"
            for i in 1 2 3 4 5; do
              git push && break
              git fetch origin "${{ github.ref_name }}"
              git rebase "origin/${{ github.ref_name }}"
              [ "$i" -eq 5 ] && exit 1
            done
          fi

      - name: Locate app-only .bin (not the merged/full-flash image)
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        id: artifact
        run: |
          cd upstream-src
          BIN=".pio/build/${{ matrix.build_env }}/firmware.bin"
          test -f "$BIN"
          NAME="${{ matrix.asset_basename }}-${{ steps.pick.outputs.version }}.bin"
          cp "$BIN" "../$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 sidecar
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        run: |
          sha256sum "${{ steps.artifact.outputs.name }}" | awk '{print $1}' > "${{ steps.artifact.outputs.name }}.sha256"

      - name: Publish release with .bin + .sha256 sidecar
        if: steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pick.outputs.release_tag }}
          name: "${{ matrix.release_title }} ${{ steps.pick.outputs.version }} - ota_mod"
          body_path: release-notes.md
          files: |
            ${{ steps.artifact.outputs.name }}
            ${{ steps.artifact.outputs.name }}.sha256

      - name: Notify on patch/build failure
        if: failure() && steps.filter.outputs.skip == 'false' && steps.check.outputs.exists == 'false' && steps.rollback_check.outputs.failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${{ matrix.id }}] Patch or build failed against ${{ steps.pick.outputs.ref }}`,
              body: `sync-build-release (${{ matrix.id }}) failed for upstream ref \`${{ steps.pick.outputs.ref }}\`. Check the workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
