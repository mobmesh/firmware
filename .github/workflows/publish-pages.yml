name: publish-pages

# Standalone manual trigger to redeploy pages/ to GitHub Pages without rebuilding firmware.
# Requires repo Settings -> Pages -> Source to be set to "GitHub Actions".
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  publish-pages:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy_first.outputs.page_url }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the console catalog is stamped from main's history

      - name: Stamp the console catalog with build history
        run: python3 scripts/console/catalog_lifespans.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stamp the app's offline version
        run: python3 scripts/stamp_app_offline.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Write build stamp for stale-page detection
        run: |
          echo "{\"sha\": \"$(git rev-parse HEAD)\"}" > pages/flasher/build-stamp.json

      - name: Upload pages/ as the Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages
          name: ${{ env.PAGES_ARTIFACT }}

      - name: Wait for the uploaded Pages artifact
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: bash .github/scripts/wait-for-pages-artifact.sh "$PAGES_ARTIFACT" "$PAGES_ARTIFACT_ID"

      # The deploy step can miss a just-uploaded artifact; one retry 15 s later covers it.
      - id: deploy_first
        name: Deploy to GitHub Pages
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

      - name: Wait before retrying the deploy
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 15

      - id: deploy_retry
        name: Retry the deploy to GitHub Pages
        if: steps.deploy_first.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
