<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeshCore Hotspot-OTA Flasher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="page-header">
      <h1>MeshCore Hotspot-OTA Flasher</h1>
      <p class="subtitle">Flash a Heltec V4 board straight from your browser over USB.</p>
    </header>

    <main id="wizard" class="card"></main>

    <footer class="page-footer">
      <p>
        Unofficial, community tooling for
        <a href="https://github.com/HeyVern/meshcore-hotspot-ota" target="_blank" rel="noopener">HeyVern/meshcore-hotspot-ota</a>,
        distinct from MeshCore's own official flasher. Requires a Chromium-based browser
        (Chrome, Edge, Opera) with Web Serial support.
      </p>
    </footer>
  </div>

  <script type="module" src="flasher.js"></script>
</body>
</html>
