ota_board_id: 12
platform: nrf52

# Override-only board config for rak3401 (RAK WisBlock RAK3401, nRF52840 + SX1262); the board itself comes from upstream.

# No Wi-Fi and no ESP32 OTA slots, so hotspot-ota cannot be selected; updates go through the OTAFIX bootloader.
capabilities:
  wifi_station: false
  dual_ota: false
  battery_measurement: unverified
  external_power_control: false
  fem_lna_control: false
  deep_sleep_rail_shutdown: false

# Pin numbers are the nRF52840's own; the radio is emulated, so these must match upstream's wiring.
qemu:
  enabled: true
  machine: "nrf52840-mobmesh,radio-cs=26,radio-dio1=10,radio-busy=9"
  binary: qemu-system-arm
  mcu: nrf52840
  mem: ""

# Facts needed by the web flasher that aren't derivable from upstream.
flasher:
  label: "RAK WisBlock RAK3401"
  connect_note: "Connect over USB; the flasher puts the board into its bootloader."
  post_flash_note: "The board restarts on its own once flashing finishes."
  # The stock catalogue entry whose erase package and OTAFIX bootloader this board shares.
  stock_device: "RAK WisMesh 1W Booster (3401 + 13302)"
