# Override-only board config for heltec_v4.
#
# This is NOT a copy of upstream MeshCore's boards/heltec_v4.json or
# variants/heltec_v4/platformio.ini -- it holds ONLY the facts specific to
# features THIS project adds on top of upstream (see mods/*/patches/). Every
# other board fact (mcu, flash size, USB hwids, psram, default partition
# scheme) is read directly from upstream at generation time by
# scripts/generate-board-config.py -- never duplicated here.
#
# The path variants/heltec_v4/ mirrors upstream's own variants/<name>/ naming
# by design, so the mapping from "which upstream variant does this override"
# is the directory path itself, not a hand-written reference field.

# Build flags injected into this board's variant platformio.ini envs,
# following upstream's own -D PIN_XXX=nn idiom (see e.g. PIN_GPS_RX,
# PIN_VEXT_EN in upstream's variants/heltec_v4/platformio.ini). Consumed by
# mods/hotspot-ota's HotspotOTA.cpp as plain macros -- no separate header.
#
# PIN_HOTSPOT_PWR: confirmed clean on Heltec V4.3.1 (GPIO48 = fallback).
# OTA_WIFI_JOIN_*: hotspot WiFi can take up to ~60s to appear after
#   PIN_HOTSPOT_PWR is asserted (cellular modem boot). 6 attempts x 15s +
#   5x5s between = ~115s worst case, comfortably past that.
# OTA_DIAG_WIFI_JOIN_ATTEMPTS: `ota wan join` uses this instead of the full
#   patient budget above -- 1 attempt (~15s) so it can't block the CLI.
# OTA_WAN_CHECK_*: advisory WAN check -- cellular modems often show L2 link
#   up before the data session negotiates.
build_flags:
  PIN_HOTSPOT_PWR: 47

  # Bench-measured across 3 boards; the schematic ratio (4.9) reads ~270 mV low
  # and upstream's 5.42 reads ~90 mV high. A stored `set adc.multiplier` wins over this.
  ADC_MULTIPLIER: 5.32
  OTA_WIFI_JOIN_ATTEMPT_TIMEOUT_MS: 15000
  OTA_WIFI_JOIN_RETRY_DELAY_MS: 5000
  OTA_WIFI_JOIN_MAX_ATTEMPTS: 6
  OTA_HTTP_TIMEOUT_MS: 20000
  OTA_DIAG_WIFI_JOIN_ATTEMPTS: 1
  OTA_WAN_CHECK_ATTEMPTS: 3
  OTA_WAN_CHECK_RETRY_DELAY_MS: 10000

# mods/power-guard. All in gauge millivolts, highest to lowest -- the ordering is
# the contract; see that mod's README for the ladder.
#
# Napping. Gap must stay wide -- sleeping sheds load and raises the reading.
  BATT_SAVER_OFF_MV: 3600   # release saving at or above
  BATT_SAVER_ON_MV: 3300    # engage saving at or below

# Return to service. Sits below ON_MV so napping gets a chance to extend runtime
# before the node stops entirely, and above SLEEP_MAX_MV so anything that
# hibernates can boot back up.
  BOOT_PWRCHECK_MIN_MV: 3150

# Hibernate. Leaves service before a brownout so a solar pack keeps the reserve
# that lets it climb back.
  BATT_SAVER_SLEEP_MAX_MV: 3149 # CLI ceiling; must stay under MIN_MV above
  BATT_SAVER_SLEEP_MV: 2800     # 0 disables; ~2.97 V at the pins on this board
  BATT_SAVER_SLEEP_FLOOR_MV: 2500  # CLI floor; ~100 mV over this board's measured
                                   # ~2400 boot floor, so the rung can still fire
  BATT_SAVER_SLEEP_SECS: 60     # first wait only; the boot check backs off after

# Sampling. Together these are the debounce window -- 3 x 60 s -- which is what
# stops a transmit's voltage sag from being read as a flat pack.
  BATT_SAVER_SAMPLE_INTERVAL_MS: 60000
  BATT_SAVER_CONSECUTIVE_SAMPLES: 3

# Retry backoff: doubles from the start value until it reaches the ceiling.
  BOOT_PWRCHECK_BACKOFF_START_SECS: 60
  BOOT_PWRCHECK_RETRY_SECS: 900

  POWEROFF_MIN_SECS: 60           # `poweroff <secs>` bounds; 0 is always refused
  POWEROFF_MAX_SECS: 86400

# Optional: only set when a board's default partition scheme (from upstream's
# boards/<name>.json) doesn't leave enough OTA slot room for this project's
# added features. Not needed for heltec_v4 today. When set to a filename (e.g.
# "custom_partitions.csv"), `scripts/generate-board-config.py flags` emits a
# `board_build.partitions = <name>.csv` build-flag line for that board's
# patch -- but vendoring the actual CSV file into the upstream tree is done
# by that same patch's own diff (as a new file, exactly like HotspotOTA.cpp
# is added today), not by this script. This never touches upstream's own
# board JSON.
partitions_override: null

# Facts needed by the web flasher that aren't derivable from upstream (mcu,
# flash size, etc. -- those come from upstream's boards/heltec_v4.json) or
# from the built partitions.bin (offsets -- see scripts/generate-board-config.py).
# This is the only other hand-maintained source for pages/flasher/boards.json.
flasher:
  label: "Heltec V4"
  connect_note: "Put the board into flash mode first (hold PGM, tap RST, then release PGM), then connect over USB."
  post_flash_note: "Press RST once to put the board back into normal operation."

  # CLI settings sent over serial after a flash, keyed by variant id. These run
  # before the location settings from member-config-*.json, so a region can
  # override a board default rather than the other way round. A variant with no
  # entry here simply gets none. Don't put `reboot` in the list -- the flasher
  # sends it raw after the whole chain (routing it through sendCommand would
  # block waiting on a reply the device never sends).
  #
  # ota.fw.url is where `ota wan` pulls an update from, so it must point at
  # this exact board+variant's image, not a generic path.
  #
  # Not seeded here: `powersaving on` -- light sleep with no serial wake source,
  # so commands after it are silently dropped. Enable at commissioning instead.
  post_flash_commands:
    repeater:
      - "set ota.fw.url https://tools.mobmesh.org/flasher/heltec_v4/repeater/firmware.bin"
      - "set tx 20"

