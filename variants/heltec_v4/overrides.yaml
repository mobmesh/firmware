ota_board_id: 1

# Project-specific board settings; remaining hardware facts come from upstream.

capabilities:
  wifi_station: true
  dual_ota: true
  battery_measurement: true
  external_power_control: true
  fem_lna_control: true
  deep_sleep_rail_shutdown: true

# Injected as build flags into this board's PlatformIO environments.
build_values:
  PIN_HOTSPOT_PWR: 47

  # A saved `set adc.multiplier` overrides this default.
  ADC_MULTIPLIER: 5.32

  # OTA join retries allow 115 seconds for hotspot startup and connection.
  OTA_WIFI_JOIN_ATTEMPT_TIMEOUT_MS: 15000
  OTA_WIFI_JOIN_RETRY_DELAY_MS: 5000
  OTA_WIFI_JOIN_MAX_ATTEMPTS: 6
  OTA_HTTP_TIMEOUT_MS: 20000
  OTA_WPA2_SESSION_LIMIT: 600   # reboot after this many WPA2 sessions
  OTA_DIAG_WIFI_JOIN_ATTEMPTS: 1   # limit `ota wan join` to one attempt
  # A cellular hotspot can connect WiFi before its WAN connection is ready.
  OTA_WAN_CHECK_ATTEMPTS: 3
  OTA_WAN_CHECK_RETRY_DELAY_MS: 10000
  # Radio-failure sleep doubles up to the maximum.
  OTA_RADIO_FAIL_SLEEP_START_SECS: 60
  OTA_RADIO_FAIL_SLEEP_MAX_SECS: 900

  # Power-guard thresholds use reported battery millivolts.
  # Auto hysteresis prevents load changes from repeatedly toggling power saving.
  POWER_GUARD_AUTO_OFF_MV: 3600   # release saving at or above
  POWER_GUARD_AUTO_ON_MV: 3300    # engage saving at or below

  # Safe-sleep recovery requires this voltage before restarting the radio.
  POWER_GUARD_RESUME_MV: 3150

  # A nonzero safe threshold enables safe sleep by default; saved settings override it.
  POWER_GUARD_SAFE_MV: 2800       # 0 disables the safe rung
  POWER_GUARD_SAFE_FLOOR_MV: 2500 # minimum nonzero CLI threshold
  POWER_GUARD_SAFE_SECS: 60       # initial safe-sleep duration

  # Three consecutive low readings filter brief voltage dips.
  POWER_GUARD_SAMPLE_INTERVAL_MS: 60000
  POWER_GUARD_CONSECUTIVE_SAMPLES: 3

  # Recovery sleep doubles up to the maximum.
  POWER_GUARD_BACKOFF_START_SECS: 60
  POWER_GUARD_BACKOFF_MAX_SECS: 900

  # Allowed duration for `poweroff <secs>`.
  POWER_GUARD_POWEROFF_MIN_SECS: 60
  POWER_GUARD_POWEROFF_MAX_SECS: 86400

# Optional partition CSV override when upstream OTA slots are too small.
partitions_override: null

# QEMU boot configuration and emulated board wiring.
qemu:
  enabled: true
  machine: esp32s3
  binary: qemu-system-xtensa
  mcu: esp32s3
  mem: 8M           # PSRAM required by the firmware
  globals:
    bramble.gpio.strap-mode: 4   # SPI boot
    bramble.gpspi2.cs-gpio: 8    # radio chip-select GPIO
    bramble.gpspi2.spi-base: "0x60025000"   # HSPI / SPI3

# Board-specific web flasher instructions and defaults.
flasher:
  label: "Heltec V4"
  connect_note: "Put the board into flash mode first (hold PGM, tap RST, then release PGM), then connect over USB."
  post_flash_note: "Press RST once to put the board back into normal operation."

  # Location settings run afterward and can override these defaults.
  # `powersaving on` prevents serial wake and would interrupt provisioning.
  post_flash_commands:
    repeater:
      - "set ota.fw.url https://tools.mobmesh.org/flasher/bin/repeater/heltec_v4.bin"
      - "set tx 20"
