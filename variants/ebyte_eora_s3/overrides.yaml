# Override-only board config for ebyte_eora_s3: only what this project adds on top of upstream.

capabilities:
  wifi_station: true
  dual_ota: true
  battery_measurement: unverified
  external_power_control: unverified
  fem_lna_control: false
  deep_sleep_rail_shutdown: false

build_values:
  PIN_HOTSPOT_PWR: 38   # header pin 13 per Ebyte pin table; plain GPIO
  OTA_WIFI_JOIN_ATTEMPT_TIMEOUT_MS: 15000
  OTA_WIFI_JOIN_RETRY_DELAY_MS: 5000
  OTA_WIFI_JOIN_MAX_ATTEMPTS: 6
  OTA_HTTP_TIMEOUT_MS: 20000
  OTA_WPA2_SESSION_LIMIT: 600   # WPA2 sessions per boot before a reboot; sized from this board's heap
  OTA_DIAG_WIFI_JOIN_ATTEMPTS: 1
  OTA_WAN_CHECK_ATTEMPTS: 3
  OTA_WAN_CHECK_RETRY_DELAY_MS: 10000
  OTA_RADIO_FAIL_SLEEP_START_SECS: 60
  OTA_RADIO_FAIL_SLEEP_MAX_SECS: 900

# Stock 4MB scheme leaves 1.25MB OTA slots; this gives both slots 0x1D0000, as on xiao_c3.
partitions_override: partitions_ebyte_eora_s3.csv

qemu:
  enabled: true
  machine: esp32s3
  binary: qemu-system-xtensa
  mcu: esp32s3
  mem: 8M
  globals:
    bramble.gpio.strap-mode: 4
    bramble.gpspi2.cs-gpio: 7
    bramble.gpspi2.spi-base: "0x60025000"
    bramble.sx1262.dio1-gpio: 33

flasher:
  label: "Ebyte EoRa-S3"
  connect_note: "Put the board into flash mode first (hold BOOT, tap RST, then release BOOT), then connect over USB."
  post_flash_note: "Press RST once to put the board back into normal operation."
  post_flash_commands:
    repeater:
      - "set ota.fw.url https://tools.mobmesh.org/flasher/bin/repeater/ebyte_eora_s3.bin"
