# Override-only board config for heltec_v3: only what this project adds on top of upstream.

capabilities:
  wifi_station: true
  dual_ota: true
  battery_measurement: unverified
  external_power_control: unverified
  fem_lna_control: false
  deep_sleep_rail_shutdown: false

build_values:
  PIN_HOTSPOT_PWR: 7   # J3 pin 18, plain GPIO; 47/48/26 are upstream GPS pins on this board
  OTA_WIFI_JOIN_ATTEMPT_TIMEOUT_MS: 15000
  OTA_WIFI_JOIN_RETRY_DELAY_MS: 5000
  OTA_WIFI_JOIN_MAX_ATTEMPTS: 6
  OTA_HTTP_TIMEOUT_MS: 20000
  OTA_DIAG_WIFI_JOIN_ATTEMPTS: 1
  OTA_WAN_CHECK_ATTEMPTS: 3
  OTA_WAN_CHECK_RETRY_DELAY_MS: 10000
  OTA_RADIO_FAIL_SLEEP_START_SECS: 60
  OTA_RADIO_FAIL_SLEEP_MAX_SECS: 900

partitions_override: null

qemu:
  enabled: true
  machine: esp32s3
  binary: qemu-system-xtensa
  mcu: esp32s3
  mem: ""
  console: uart0   # CLI is on UART0 behind the CP2102, not the S3's USB
  globals:
    bramble.gpio.strap-mode: 4
    bramble.gpspi2.cs-gpio: 8
    bramble.gpspi2.spi-base: "0x60025000"

flasher:
  label: "Heltec V3"
  connect_note: "Put the board into flash mode first (hold PRG, tap RST, then release PRG), then connect over USB."
  post_flash_note: "Press RST once to put the board back into normal operation."
  post_flash_commands:
    repeater:
      - "set ota.fw.url https://tools.mobmesh.org/flasher/heltec_v3/repeater/firmware.bin"
