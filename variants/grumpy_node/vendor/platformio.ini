[Grumpy_Node]
extends = esp32_base
board = seeed_xiao_esp32c3
board_build.flash_mode = dio
board_build.partitions = variants/grumpy_node/partitions.csv
build_unflags = -D LORA_FREQ=869.618
build_flags =
  ${esp32_base.build_flags}
  -I variants/grumpy_node
  -D ESP32_CPU_FREQ=80
  ; XIAO D6 / GPIO21 is E22P EN and is reclaimed from UART0 TX during board startup.
  -D PIN_RADIO_EN=21
  -D P_LORA_DIO_1=D2
  -D P_LORA_NSS=D7
  -D P_LORA_RESET=D1
  -D P_LORA_BUSY=D3
  -D P_LORA_SCLK=D8
  -D P_LORA_MISO=D9
  -D P_LORA_MOSI=D10
  -D PIN_BOARD_SDA=D4
  -D PIN_BOARD_SCL=D5
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  ; E22P-915M30S: ~20 dBm SX1262 drive -> ~30 dBm at antenna.
  ; Higher than ~20–22 dBm drive just distorts the PA.
  -D LORA_TX_POWER=20
  -D MAX_LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  ; Module is 902–928 MHz — default MeshCore 869.618 is the wrong band for this PA.
  -D LORA_FREQ=915.8
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/grumpy_node>
lib_deps =
  ${esp32_base.lib_deps}

[env:Grumpy_Node_repeater]
extends = Grumpy_Node
build_src_filter = ${Grumpy_Node.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Grumpy_Node.build_flags}
  -D ADVERT_NAME='"Grumpy Node Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Grumpy_Node.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:Grumpy_Node_room_server]
extends = Grumpy_Node
build_src_filter = ${Grumpy_Node.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${Grumpy_Node.build_flags}
  -D ADVERT_NAME='"Grumpy Node Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Grumpy_Node.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
