# Mod-level facts. build_src_filter is derived from what is under files/, so the
# two cannot drift apart; this mod ships headers only, so it contributes none.
name: power-guard

env_flags: [WITH_POWER_GUARD]

integration:
  header: helpers/esp32/PowerGuardIntegration.h
  hooks:
    before_radio_init: powerGuardBeforeRadioInit
    loop: powerGuardLoop
    wants_power_saving: powerGuardWantsPowerSaving
    cli:
      handler: powerGuardHandleCli
      priority: 200
