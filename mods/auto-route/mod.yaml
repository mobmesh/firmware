# Mod-level facts. build_src_filter is derived from what is under files/, so the two
# cannot drift apart.
name: auto-route

env_flags: [WITH_AUTO_ROUTE]

integration:
  header: helpers/auto_route/AutoRouteIntegration.h
  hooks:
    loop: autoRouteLoop
    direct: autoRouteDirect
    cli:
      handler: autoRouteHandleCli
      # Claims only its own keys, below radio-diag's 150.
      priority: 170
