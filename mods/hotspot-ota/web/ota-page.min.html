<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MeshCore OTA</title><style>:root{color-scheme:dark;--bg:#070b10;--text:#edf7ff;--muted:#8ea2b5;--accent:#25d0c7;--accent2:#5d7cff;--good:#4cdb86;--bad:#ff6470}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 20% 0%,#12333c66,transparent 60%),radial-gradient(700px 500px at 100% 100%,#18235466,transparent 55%),var(--bg);color:var(--text);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}.card{width:min(720px,100%);overflow:hidden;border:1px solid #ffffff16;border-radius:24px;background:linear-gradient(180deg,#111923ee,#0a1017f2);box-shadow:0 28px 90px #000a,0 0 0 1px #ffffff05 inset;transition:.5s ease}.card.success{border-color:#4cdb8655;box-shadow:0 28px 90px #000a,0 0 60px #4cdb8620,0 0 0 1px #4cdb8630 inset}.card.success .logo{background:linear-gradient(135deg,#43e07e,#25d0c7);box-shadow:0 8px 32px #4cdb8655}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 18px;border-bottom:1px solid #ffffff0c}.brand{display:flex;align-items:center;gap:13px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 28px #25d0c744;transition:.4s ease}.logo svg{width:23px;height:23px}h1{font-size:18px;margin:0;letter-spacing:.2px}.sub{color:var(--muted);font-size:12px;margin-top:2px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good)}.body{padding:24px}.device{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:16px 18px;margin-bottom:18px;border:1px solid #ffffff0d;border-radius:16px;background:linear-gradient(180deg,#ffffff05,#ffffff02)}.kicker{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.14em}#identity{font-weight:650;margin-top:3px}.badge{padding:7px 10px;border-radius:999px;background:#25d0c714;border:1px solid #25d0c72e;color:#8ff8f2;font-size:12px}.drop{display:block;position:relative;padding:38px 24px;text-align:center;border:1px dashed #3b5368;border-radius:18px;background:linear-gradient(180deg,#0a1118aa,#09101866);transition:.22s ease;cursor:pointer;overflow:hidden}.drop.hidden{display:none}.drop:hover,.drop.drag{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 0 0 4px #25d0c70b,0 18px 40px #0005}.icon{width:56px;height:56px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;color:#affff9;background:#25d0c713;border:1px solid #25d0c728;box-shadow:0 10px 30px #0006}.icon svg{width:27px;height:27px}.drop strong{display:block;font-size:16px}.drop small{display:block;color:var(--muted);margin-top:6px}input[type=file]{display:none}.file{display:none;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#ffffff05;border:1px solid #ffffff0d}.file.show{display:grid}.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{color:var(--muted);font-size:12px;margin-top:3px}.hash{margin-top:5px;color:#6f8497;font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.clear{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}.clear:disabled{opacity:.25;cursor:default}.upload{display:block;width:100%;margin-top:18px;border:0;border-radius:14px;padding:13px 18px;color:#061010;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#5df4e9,#6a88ff);box-shadow:0 12px 30px #25d0c72a;transition:.2s ease}.upload:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 36px #25d0c73b}.upload:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.progress{display:none;margin-top:18px}.progress.show{display:block}.row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-bottom:8px}.track{height:9px;border-radius:999px;overflow:hidden;background:#05080c;border:1px solid #ffffff0c}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 20px #25d0c777;transition:width .15s linear}.msg{display:none;margin-top:16px;padding:14px;border-radius:14px;border:1px solid #ffffff10;background:#ffffff05}.msg.show{display:block}.msg.good{border-color:#4cdb8630;background:#4cdb860d;color:#9af8bd}.msg.bad{border-color:#ff647033;background:#ff64700d;color:#ffadb4}.footer{padding:0 24px 22px;color:#607487;font-size:11px;text-align:center}@media(max-width:520px){.top,.body{padding-left:18px;padding-right:18px}.device{grid-template-columns:1fr}.status{display:none}}</style></head><body><main class="card" id="card"><header class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M7 12a5 5 0 0 1 10 0"/><path d="M10 12a2 2 0 0 1 4 0"/><circle cx="12" cy="16.5" r="1.2" fill="currentColor" stroke="none"/></svg></div><div><h1>MeshCore OTA</h1><div class="sub">Wireless firmware updater</div></div></div><div class="status"><span class="dot"></span>OTA mode active</div></header><section class="body"><div class="device"><div><div class="kicker">Device</div><div id="identity">Detecting identity…</div></div><div class="badge" id="hardware" hidden></div></div><label class="drop" id="drop"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg></div><strong>Drop firmware here</strong><small>or click to choose a .bin file</small><input id="pick" type="file" accept=".bin,application/octet-stream"></label><div class="file" id="filebox"><div><div class="name" id="filename"></div><div class="meta" id="filemeta"></div><div class="hash" id="hash">MD5: calculating…</div></div><button class="clear" id="clear" type="button" aria-label="Remove file">×</button></div><button class="upload" id="upload" disabled>Install firmware</button><div class="progress" id="progress"><div class="row"><span id="stage">Preparing…</span><span id="pct">0%</span></div><div class="track"><div class="bar" id="bar"></div></div></div><div class="msg" id="msg"></div></section><div class="footer">Keep this page open until the device confirms completion.</div></main><script>const $=s=>document.querySelector(s),pick=$("#pick"),drop=$("#drop"),upload=$("#upload"),msg=$("#msg"),progress=$("#progress"),bar=$("#bar"),pct=$("#pct"),stage=$("#stage"),card=$("#card"),clear=$("#clear");let file=null,fileMD5=null;fetch("/update/identity").then(r=>r.ok?r.json():Promise.reject()).then(j=>{$("#identity").textContent=j.id||"Unknown";if(j.hardware){$("#hardware").textContent=j.hardware;$("#hardware").hidden=false}}).catch(()=>{$("#identity").textContent="Unknown";$("#hardware").hidden=true});const niceSize=n=>n>=1048576?(n/1048576).toFixed(2)+" MiB":(n/1024).toFixed(1)+" KiB";function md5(ab){const u=new Uint8Array(ab),n=u.length,b=((n+8>>6)+1)<<6,x=new Uint8Array(b),v=new DataView(x.buffer);x.set(u);x[n]=128;v.setUint32(b-8,(n<<3)>>>0,true);v.setUint32(b-4,Math.floor(n/536870912),true);let a=1732584193,c=4023233417,d=2562383102,e=271733878;const s=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21],k=[];for(let i=0;i<64;i++)k[i]=(Math.abs(Math.sin(i+1))*4294967296)|0;for(let o=0;o<b;o+=64){let A=a,C=c,D=d,E=e;for(let i=0;i<64;i++){let f,g;if(i<16){f=C&D|~C&E;g=i}else if(i<32){f=E&C|~E&D;g=(5*i+1)%16}else if(i<48){f=C^D^E;g=(3*i+5)%16}else{f=D^(C|~E);g=7*i%16}const z=(A+f+k[i]+v.getUint32(o+4*g,true))|0;A=E;E=D;D=C;C=(C+((z<<s[i])|(z>>>(32-s[i]))))|0;}a=(a+A)|0;c=(c+C)|0;d=(d+D)|0;e=(e+E)|0;}return [a,c,d,e].map(q=>[q&255,q>>>8&255,q>>>16&255,q>>>24&255].map(h=>h.toString(16).padStart(2,"0")).join("")).join("");}async function setFile(f){file=f||null;fileMD5=null;drop.classList.toggle("hidden",!!file);$("#filebox").classList.toggle("show",!!file);upload.disabled=true;clear.disabled=false;msg.className="msg";progress.className="progress";card.classList.remove("success");bar.style.width="0";pct.textContent="0%";upload.textContent="Install firmware";if(!file)return;$("#filename").textContent=file.name;$("#filemeta").textContent=niceSize(file.size);$("#hash").textContent="MD5: calculating…";try{const buf=await file.arrayBuffer(),h=md5(buf);if(file!==f)return;fileMD5=h;$("#hash").textContent="MD5: "+h;upload.disabled=false}catch{$("#hash").textContent="MD5 calculation failed";msg.textContent="Unable to read firmware file.";msg.className="msg show bad"}}pick.onchange=()=>setFile(pick.files[0]);clear.onclick=()=>{if(clear.disabled)return;pick.value="";setFile(null)};["dragenter","dragover"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove("drag")}));drop.addEventListener("drop",e=>{if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0])});upload.onclick=()=>{if(!file||!fileMD5)return;upload.disabled=true;clear.disabled=true;upload.textContent="Installing…";progress.className="progress show";msg.className="msg";card.classList.remove("success");stage.textContent="Uploading firmware…";const form=new FormData();form.append("MD5",fileMD5);form.append("update",file,file.name);const xhr=new XMLHttpRequest();xhr.open("POST","/update");xhr.upload.onprogress=e=>{if(!e.lengthComputable)return;const p=Math.round(e.loaded/e.total*100);bar.style.width=p+"%";pct.textContent=p+"%"};xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300){bar.style.width="100%";pct.textContent="100%";stage.textContent="Firmware installed";upload.textContent="Complete";msg.innerHTML="<strong>Update complete.</strong><br>The device is rebooting into the new firmware.";msg.className="msg show good";card.classList.add("success")}else{msg.textContent="Update failed: "+(xhr.responseText||("HTTP "+xhr.status));msg.className="msg show bad";upload.textContent="Retry installation";upload.disabled=false;clear.disabled=false}};xhr.onerror=()=>{msg.textContent="Connection lost during upload.";msg.className="msg show bad";upload.textContent="Retry installation";upload.disabled=false;clear.disabled=false};xhr.send(form);};</script></body></html>
