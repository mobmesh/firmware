# Mod-level facts. build_src_filter is not listed: it is derived from what is
# actually under files/, so the two cannot drift apart.
name: hotspot-ota

env_flags: [WITH_HOTSPOT_OTA, WITH_OTA_ROLLBACK_GUARD]

# A mod earns a bit only if the built image carries something that proves it is compiled
# in. Bits are permanent: never renumber one, never reuse a retired mod's. See
# mods/bit-registry.md before assigning the next.
bit: 1
image_marker: "H0TSP0T"

# Served in place of upstream's OTA page; the generator compiles this to a header and
# drops upstream's OTA web library from any target selecting this mod.
ota_web_page: web/ota-page.min.html

requirements:
  required: [wifi_station, dual_ota]
  optional: [external_power_control]

integration:
  header: helpers/esp32/HotspotOtaIntegration.h
  hooks:
    radio_init_policy: hotspotOtaRadioInit
    loop: hotspotOtaLoop
    cli:
      handler: hotspotOtaHandleCli
      # Above power-guard's 200: the OTA interlock must see poweroff/shutdown before power-guard
      # consumes them. With no OTA running this handler declines and dispatch continues unchanged.
      priority: 300
