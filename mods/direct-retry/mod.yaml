# Mod-level facts. build_src_filter is derived from what is under files/, so the two
# cannot drift apart.
name: direct-retry

env_flags: [WITH_DIRECT_RETRY]

integration:
  header: helpers/direct_retry/DirectRetryIntegration.h
  hooks:
    loop: directRetryLoop
    direct: directRetryDirect
    cli:
      handler: directRetryHandleCli
      # Claims only its own keys, below diag-report's 150.
      priority: 170
