# Mod-level facts. build_src_filter is derived from what is under files/, so the two
# cannot drift apart.
name: radio-diag

env_flags: [WITH_RADIO_DIAG]

requirements:
  # diag lna refuses at runtime where the board cannot switch its LNA, so one binary serves every variant.
  optional: [fem_lna_control]

integration:
  header: helpers/radio_diag/RadioDiagIntegration.h
  hooks:
    loop: radioDiagLoop
    recv: radioDiagRecv
    cli:
      handler: radioDiagHandleCli
      # Above try-settings' 100 so an LNA tryset is seen first, below power-guard's 200.
      priority: 150
