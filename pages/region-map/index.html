<!doctype html>
<html lang="en" class="config-page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Map of the GulfCoastMesh region transport scopes: gc, the coastal states, and the mapped repeater cities."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="../shared/style.css" />
    <link rel="stylesheet" href="region-map.css" />
    <title>Region Map</title>
  </head>
  <body class="config-body region-map-body">
    <div class="region-map-layout">
      <aside class="region-map-controls" id="controls">
        <div class="region-map-controls-inner">
          <div class="region-map-controls-top">
            <h2 class="region-map-panel-title">Region scopes</h2>
            <div class="search-wrap region-map-search-wrap">
              <span class="search-icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
              </span>
              <input
                type="text"
                class="search-input"
                id="code-input"
                placeholder="Find a code or place…"
                aria-label="Find a region code or place"
                autocomplete="off"
              />
            </div>
            <p class="region-map-counter" id="counter">Loading…</p>
          </div>

          <div class="region-map-controls-scroll">
            <div class="region-map-overlays">
              <p class="region-map-overlays-title">Overlays</p>
              <label class="region-map-check">
                <input type="checkbox" id="show-states" checked />
                <span>State areas</span>
              </label>
              <label class="region-map-check">
                <input type="checkbox" id="show-places" checked />
                <span>Repeater cities</span>
              </label>
            </div>

            <div class="region-map-hierarchy">
              <p class="region-map-overlays-title">Hierarchy</p>
              <div class="hierarchy-tree" id="hierarchy"></div>
            </div>
          </div>
        </div>
      </aside>

      <button
        type="button"
        class="copy-btn serial-btn-secondary region-map-controls-toggle"
        id="toggle-controls"
        aria-expanded="true"
      >
        Hide panel
      </button>

      <main class="region-map-main">
        <div class="region-map-header-bar">
          <div class="region-map-header-brand">
            <span class="badge-pill">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6 9 3ZM9 3v15M15 6v15"
                />
              </svg>
              REGION MAP
            </span>
            <h1>Region Map</h1>
          </div>
          <div class="region-map-header-links">
            <a class="copy-btn serial-btn-secondary" href="../configurator/"
              >Open configurator</a
            >
            <a
              class="github-link region-map-github"
              href="https://github.com/mobmesh/firmware"
              aria-label="View this project on GitHub"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"
                ></path>
              </svg>
              <span>mobmesh/firmware</span>
            </a>
          </div>
        </div>
        <div id="region-map-container"></div>
        <p class="region-map-selection" id="selection-note"></p>
      </main>
    </div>

    <script src="../shared/vendor/leaflet/leaflet.js"></script>
    <script src="../shared/gc-regions.js"></script>
    <script src="region-map.js"></script>
  </body>
</html>
