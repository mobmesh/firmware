<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeshCore Serial Workflow Test</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .workflow-container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .workflow-step {
      margin-bottom: 1.5rem;
    }
    .step-output {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
      color: var(--fg);
      min-height: 100px;
      max-height: 500px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .status-badge.connected {
      background: rgba(45, 209, 189, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .status-badge.disconnected {
      background: rgba(232, 99, 122, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .status-badge.ready {
      background: rgba(45, 209, 189, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .status-badge.not-ready {
      background: rgba(232, 99, 122, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
  </style>
</head>
<body>
  <div class="workflow-container">
    <h1>MeshCore Serial Workflow Test</h1>
    <div id="workflow-content"></div>
    <div style="text-align: center; margin-top: 2rem; font-size: 0.8rem; color: var(--fg-muted);">
      Version: 10
    </div>
  </div>

  <script>
    let port = null;
    let reader = null;
    let readableClosed = null;
    let keepReading = false;
    let connectionLost = false;
    let workflow = null;
    let lastOutput = "";

    const container = document.getElementById("workflow-content");
    let deviceReadinessPollInterval = null;
    const ESPRESSIF_VENDOR_ID = 0x303a;

    async function checkDeviceReady(requiredProductId) {
      try {
        const ports = await navigator.serial.getPorts();
        for (const p of ports) {
          const info = p.getInfo();
          if (info.usbVendorId === ESPRESSIF_VENDOR_ID && info.usbProductId === requiredProductId) {
            return true;
          }
        }
        return false;
      } catch (err) {
        return false;
      }
    }

    function updateDeviceReadiness(ready) {
      const badge = document.getElementById("device-readiness-badge");
      if (badge) {
        badge.className = ready ? "status-badge ready" : "status-badge not-ready";
        badge.textContent = ready ? "READY" : "NOT READY";
      }
    }

    function log(text) {
      lastOutput += text;
      updateOutput();
    }

    function updateOutput() {
      const outputEl = document.getElementById("step-output");
      if (outputEl) outputEl.textContent = lastOutput;
    }

    function setStatus(connected) {
      const statusEl = document.getElementById("status-badge");
      if (statusEl) {
        statusEl.className = connected ? "status-badge connected" : "status-badge disconnected";
        statusEl.textContent = connected ? "CONNECTED" : "DISCONNECTED";
      }
    }

    async function readLoop() {
      const decoder = new TextDecoderStream();
      readableClosed = port.readable.pipeTo(decoder.writable);
      reader = decoder.readable.getReader();
      try {
        while (keepReading) {
          const { value, done } = await reader.read();
          if (done) break;
          if (value) log(value);
        }
      } catch (err) {
        log(`\n[connection lost: ${err.message}]\n`);
        connectionLost = true;
        disconnect();
        if (workflow.onConnectionLost) workflow.onConnectionLost();
      }
    }

    async function connect(isReconnect = false) {
      if (!("serial" in navigator)) {
        log("Web Serial isn't supported in this browser.\n");
        return false;
      }
      try {
        if (isReconnect) {
          const ports = await navigator.serial.getPorts();
          if (ports.length > 0) {
            try {
              console.log(`Attempting auto-reconnect to ${ports[0].getInfo().usbProductName}...`);
              port = ports[0];
              await port.open({ baudRate: 115200 });
              console.log("Auto-reconnect succeeded");
            } catch (err) {
              console.log("Auto-reconnect failed:", err.message);
              log("[auto-reconnect failed, select port manually]\n");
              port = await navigator.serial.requestPort();
              await port.open({ baudRate: 115200 });
            }
          } else {
            console.log("No previously approved ports, requesting manual selection");
            port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
          }
        } else {
          port = await navigator.serial.requestPort();
          await port.open({ baudRate: 115200 });
        }
      } catch (err) {
        log(`[could not open port: ${err.message}]\n`);
        port = null;
        return false;
      }
      keepReading = true;
      connectionLost = false;
      setStatus(true);
      readLoop();
      return true;
    }

    async function disconnect() {
      keepReading = false;
      if (reader) {
        await reader.cancel().catch(() => {});
        reader = null;
      }
      if (readableClosed) {
        await readableClosed.catch(() => {});
        readableClosed = null;
      }
      if (port) {
        await port.close().catch(() => {});
        port = null;
      }
      setStatus(false);
    }

    async function send(text) {
      if (!port || !port.writable) {
        log("[not connected]\n");
        return false;
      }
      const writer = port.writable.getWriter();
      try {
        await writer.write(new TextEncoder().encode(`${text}\r\n`));
        return true;
      } finally {
        writer.releaseLock();
      }
    }

    function renderStep(title, instruction, showOutput = true, requiredProductId = null) {
      lastOutput = "";
      if (deviceReadinessPollInterval) clearInterval(deviceReadinessPollInterval);

      let html = `
        <div class="workflow-step">
          <div id="status-container" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem;">
            <div>
              <h2 style="margin: 0;">${title}</h2>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end;">
              <button id="debug-devices-btn" class="btn btn-secondary" type="button" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;">Debug: Show Devices</button>
              ${requiredProductId !== null ? `<div id="device-readiness-badge" class="status-badge not-ready">NOT READY</div>` : ''}
              <div id="status-badge" class="status-badge ${port ? 'connected' : 'disconnected'}">
                ${port ? 'CONNECTED' : 'DISCONNECTED'}
              </div>
            </div>
          </div>
          <p class="step-desc">${instruction}</p>
      `;
      if (showOutput) {
        html += `<div id="step-output" class="step-output"></div>`;
      }
      html += `<div class="actions" style="justify-content: flex-start;"></div></div>`;
      container.innerHTML = html;
      if (showOutput) updateOutput();

      // Start polling for device readiness if required product ID is specified
      if (requiredProductId !== null) {
        const checkReady = async () => {
          const ready = await checkDeviceReady(requiredProductId);
          updateDeviceReadiness(ready);
        };
        checkReady();
        deviceReadinessPollInterval = setInterval(checkReady, 500);
      }

      // Add debug button listener
      const debugBtn = container.querySelector("#debug-devices-btn");
      debugBtn.addEventListener("click", async () => {
        const ports = await navigator.serial.getPorts();
        let output = "=== Connected Devices ===\n\n";
        if (ports.length === 0) {
          output += "No devices found.\n";
        } else {
          ports.forEach((p, idx) => {
            const info = p.getInfo();
            output += `Device ${idx + 1}:\n`;
            output += `  vendorId: 0x${info.usbVendorId?.toString(16) || 'N/A'}\n`;
            output += `  productId: 0x${info.usbProductId?.toString(16) || 'N/A'}\n\n`;
          });
        }
        lastOutput = output;
        updateOutput();
      });

      return container.querySelector(".actions");
    }

    // Step 1: Initial Connection (manual only)
    async function step1() {
      const actions = renderStep(
        "Step 1: Initialize Connection",
        "Please connect your device via USB and click Connect.",
        true,
        0x2
      );

      const btn = document.createElement("button");
      btn.className = "btn btn-primary";
      btn.textContent = "Connect Device";
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        if (await connect()) {
          log("✓ Connected!\n\n");
          log("Waiting for connection loss (hold PGM and press RST)...\n");

          workflow = {
            onConnectionLost: () => {
              log("✓ Connection lost - boot mode detected!\n");
              setTimeout(() => step2(), 500);
            }
          };
        } else {
          btn.disabled = false;
        }
      });
      actions.appendChild(btn);
    }

    // Step 2: Manual connection - connect then wait for disconnection
    async function step2() {
      const actions = renderStep(
        "Step 2: Boot Mode Connection",
        "Attempting auto-reconnect (2 attempts)...",
        true,
        0x1001
      );

      log("Auto-reconnect attempt 1...\n");
      let attempt = 1;

      const tryAutoConnect = async () => {
        if (await connect(true)) {
          log("✓ Connected to boot mode!\n\n");
          log("Now press RST to return to CLI mode and wait for connection loss...\n");

          workflow = {
            onConnectionLost: () => {
              log("✓ Connection lost - device returning to CLI mode!\n");
              log("Proceeding to Step 3...\n");
              setTimeout(() => step3(), 500);
            }
          };
        } else {
          attempt++;
          if (attempt <= 2) {
            log("Waiting 1 second before attempt 2...\n\n");
            setTimeout(tryAutoConnect, 1000);
          } else {
            log("\nAuto-reconnect failed. Using manual connect button.\n");
            actions.innerHTML = "";
            const connectBtn = document.createElement("button");
            connectBtn.className = "btn btn-primary";
            connectBtn.textContent = "Manual Connect";
            actions.appendChild(connectBtn);

            connectBtn.addEventListener("click", async () => {
              connectBtn.disabled = true;
              if (await connect()) {
                log("✓ Connected to boot mode!\n\n");
                log("Now press RST to return to CLI mode and wait for connection loss...\n");

                workflow = {
                  onConnectionLost: () => {
                    log("✓ Connection lost - device returning to CLI mode!\n");
                    log("Proceeding to Step 3...\n");
                    setTimeout(() => step3(), 500);
                  }
                };
              } else {
                connectBtn.disabled = false;
              }
            });
          }
        }
      };

      tryAutoConnect();
    }

    // Step 3: Reconnect for CLI with retry loop
    async function step3() {
      const actions = renderStep(
        "Step 3: Return to CLI Mode",
        "Please press RST to return to CLI mode. Attempting auto-reconnect...",
        true,
        0x2
      );

      const btn = document.createElement("button");
      btn.className = "btn btn-primary";
      btn.textContent = "Manual Connect";
      btn.disabled = true;
      actions.appendChild(btn);

      let retries = 0;
      const maxRetries = 15; // 15 seconds max

      const attemptReconnect = async () => {
        retries++;
        log(`Attempt ${retries}: Trying auto-reconnect...\n`);

        if (await connect(true)) {
          log("✓ Reconnected successfully! Proceeding to step 4...\n");
          btn.disabled = true;
          setTimeout(() => step4(), 1000);
          return;
        }

        if (retries < maxRetries) {
          log(`Waiting 1 second before retry...\n\n`);
          setTimeout(attemptReconnect, 1000);
        } else {
          log("\n✗ Auto-reconnect failed after 15 attempts.\n");
          btn.disabled = false;
          btn.textContent = "Try Manual Connect";
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            log("Attempting manual connection...\n");
            if (await connect()) {
              log("Connected! Proceeding to step 4...\n");
              setTimeout(() => step4(), 1000);
            } else {
              btn.disabled = false;
            }
          });
        }
      };

      attemptReconnect();
    }

    // Step 4: Send 'ver' command and display response
    async function step4() {
      const actions = renderStep(
        "Step 4: Query Device Version",
        "Sending 'ver' command to device and displaying response..."
      );

      lastOutput = "Sending 'ver' command...\n\n";
      updateOutput();

      await send("ver");
      log("\nWaiting for device response (3 seconds)...\n");

      setTimeout(() => {
        log("\n\n✓ Workflow test complete!\n");
        const completeBtn = document.createElement("button");
        completeBtn.className = "btn btn-primary";
        completeBtn.textContent = "Restart Test";
        completeBtn.addEventListener("click", async () => {
          await disconnect();
          step1();
        });
        actions.appendChild(completeBtn);
      }, 3000);
    }

    // Start
    step1();
  </script>
</body>
</html>
