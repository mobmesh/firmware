# Single source of truth for what gets built and released: which (board, role) combinations
# exist and what goes into each. Board hardware facts live in variants/<board>/overrides.yaml.
#
# Every target lists every mod it wants -- nothing is applied by default except core_mods.
# asset_basename isn't here; resolve-targets computes it as <board>_<role_abbrev>_mobmesh.
#
# vendor_flasher_assets: exactly one target per BOARD, since each board's bootloader.bin/
# partitions.bin/boot_app0.bin are partition-table specific and never shared between boards.

# Applied to every target, in this order, before any target-specific mods below.
# A mod that stops shipping everywhere belongs in a target's own `mods:` list instead.
core_mods: [shim, hotspot-ota, timing-safety, try-settings]

roles:
  repeater:
    asset_role_abbrev: rep
    upstream_tag_prefix: repeater
    release_title: Repeater
    make_latest: true
  room_server:
    asset_role_abbrev: room
    upstream_tag_prefix: room-server
    release_title: Room
    make_latest: false

targets:
  - board: heltec_v4
    role: repeater
    build_env: heltec_v4_repeater
    vendor_flasher_assets: true
    # heltec_v4 only: its battery divider is the one that has been bench-measured.
    mods: [power-guard]
    # Headless: drops the OLED and the button's long-press power-off.
    # Joined form -- PlatformIO splits "-U FOO" into a bare -U.
    build_flags_append: ["-UDISPLAY_CLASS"]

  - board: heltec_v4
    role: room_server
    build_env: heltec_v4_room_server
    vendor_flasher_assets: false
    mods: []      # extras beyond core_mods
    # qemu_boot_check: false   # opt this role out of the emulator gate

  - board: xiao_c3
    role: repeater
    build_env: Xiao_C3_repeater
    vendor_flasher_assets: true
    mods: []      # extras beyond core_mods

  - board: xiao_c3
    role: room_server
    build_env: Xiao_C3_room_server
    vendor_flasher_assets: false
    mods: []      # extras beyond core_mods
