# Single source of truth for what gets built and released.
#
# Each entry is one (board, role) combination this project ships. `mods`
# lists which mods/<name>/ this target includes -- every target lists every
# mod it wants explicitly, nothing is applied by default. Board hardware
# facts (pins, timeouts, partitions, flasher notes) live in
# variants/<board>/overrides.yaml, not here; this file only decides what
# combinations exist and which features go into each one.
#
# asset_basename is not listed here -- it's computed by
# `scripts/generate-board-config.py resolve-targets` as
# <board>_<asset_role_abbrev>_mobmesh -- a label, not a mod inventory.
#
# vendor_flasher_assets: exactly one target per BOARD should be true. It controls
# whether this target's build vendors that board's bootloader.bin/partitions.bin/
# boot_app0.bin into pages/flasher/<board>/ for the web flasher's "New device" (full
# erase) flow. These files are NOT shared/generic across boards or roles -- each
# board's partition table (see variants/<board>/overrides.yaml's partitions_override)
# is different, so they're always sourced fresh from THIS target's own build output,
# never copied from another board or reused across runs.
# Applied to every target, in this order, before any target-specific mods below.
# Keep entries here only while they genuinely ship everywhere -- a mod that becomes
# optional belongs in a target's own `mods:` list instead.
core_mods: [shim, hotspot-ota, timing-safety]

targets:
  - board: heltec_v4
    role: repeater
    build_env: heltec_v4_repeater
    upstream_tag_prefix: repeater
    release_title: Repeater
    asset_role_abbrev: rep
    vendor_flasher_assets: true
    # If true, must match across all targets of this role.
    make_latest: true
    # heltec_v4 only: its battery divider is the one that has been bench-measured.
    mods: [power-guard]
    # Headless: drops the OLED and the button's long-press power-off.
    # Joined form -- PlatformIO splits "-U FOO" into a bare -U.
    build_flags_append: ["-UDISPLAY_CLASS"]

  - board: heltec_v4
    role: room_server
    build_env: heltec_v4_room_server
    upstream_tag_prefix: room-server
    release_title: Room
    asset_role_abbrev: room
    vendor_flasher_assets: false
    make_latest: false
    mods: []      # extras beyond core_mods

  - board: xiao_c3
    role: repeater
    build_env: Xiao_C3_repeater
    upstream_tag_prefix: repeater
    release_title: Repeater
    asset_role_abbrev: rep
    vendor_flasher_assets: true
    # If true, must match across all targets of this role.
    make_latest: true
    mods: []      # extras beyond core_mods

  - board: xiao_c3
    role: room_server
    build_env: Xiao_C3_room_server
    upstream_tag_prefix: room-server
    release_title: Room
    asset_role_abbrev: room
    vendor_flasher_assets: false
    make_latest: false
    mods: []      # extras beyond core_mods
